# AcademicPages configuration for Nguyen Bao Trung
locale                   : "en-GB"
site_theme               : "default"
title                    : "Nguyen Bao Trung"
title_separator          : "•"
name                     : &name "Nguyen Bao Trung"
description              : &description "Academic website of Nguyen Bao Trung, MD, MSc: CBCT research, 3D dental imaging, and quantitative analysis."
url                      : "https://trungnb.github.io"
baseurl                  : ""
repository               : "trungnb/trungnb.github.io"

author:
  avatar           : "profile.jpg"
  name             : "Nguyen Bao Trung, MD, MSc"
  bio              : "Dentist | CBCT & 3D imaging researcher"
  email            : "nbtrungrhm@gmail.com"
  orcid            : "https://orcid.org/0009-0007-7341-8925"
  github           : "trungnb"

markdown                 : kramdown
highlighter              : rouge
lsi                      : false
excerpt_separator        : "<!--more-->"
incremental              : false

include                  : [".htaccess", "_pages"]
exclude                  : ["Gemfile", "Gemfile.lock", "node_modules", "vendor/bundle/", "vendor/cache/", "vendor/gems/", "vendor/ruby/"]
keep_files               : [".git", ".svn"]
encoding                 : "utf-8"
markdown_ext             : "markdown,mkdown,mkdn,mkd,md"

collections:
  publications:
    output: true
    permalink: /:collection/:path/
  portfolio:
    output: true
    permalink: /:collection/:path/

defaults:
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "single"
      author_profile: true
  - scope:
      path: ""
      type: "publications"
    values:
      layout: "single"
      author_profile: true
      comments: false
      share: false
  - scope:
      path: ""
      type: "portfolio"
    values:
      layout: "single"
      author_profile: true
      share: false
