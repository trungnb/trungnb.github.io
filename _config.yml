# AcademicPages Configuration for Dr. Nguyen Bao Trung
locale                   : "en-US"
site_theme               : "default"
title                    : "Dr. Nguyen Bao Trung, MD, MSc"
title_separator          : "•"
name                     : &name "Nguyen Bao Trung, MD, MSc"
description              : &description "Academic website & portfolio of Dr. Nguyen Bao Trung, MD, MSc - Oral Surgeon & Dental AI Researcher."
url                      : "https://trungnb.github.io"
baseurl                  : ""
repository               : "trungnb/trungnb.github.io"

# Site Author
author:
  avatar           : "profile.jpg"
  name             : "Nguyen Bao Trung, MD, MSc"
  pronouns         : "he/him"
  bio              : "Oral Surgeon & Dental AI Researcher"
  location         : "Ho Chi Minh City, Vietnam"
  employer         : "University of Medicine and Pharmacy at Ho Chi Minh City"
  uri              : "https://periapical.ai.studio"
  email            : "nbtrungrhm@gmail.com"

  # Academic websites
  orcid            : "https://orcid.org/0009-0007-7341-8925"

  # Software
  github           : "trungnb"

# Site Settings
markdown                 : kramdown
highlighter              : rouge
lsi                      : false
excerpt_separator        : "<!--more-->"
incremental              : false

include                  : [".htaccess"]
exclude                  : ["Gemfile", "Gemfile.lock", "node_modules", "vendor/bundle/", "vendor/cache/", "vendor/gems/", "vendor/ruby/"]
keep_files               : [".git", ".svn"]
encoding                 : "utf-8"
markdown_ext             : "markdown,mkdown,mkdn,mkd,md"

# Collections
collections:
  publications:
    output: true
    permalink: /:collection/:path/
  portfolio:
    output: true
    permalink: /:collection/:path/
  talks:
    output: true
    permalink: /:collection/:path/
  teaching:
    output: true
    permalink: /:collection/:path/

# Defaults
defaults:
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "single"
      author_profile: true
  - scope:
      path: ""
      type: "publications"
    values:
      layout: "single"
      author_profile: true
      comments: false
      share: true
  - scope:
      path: ""
      type: "portfolio"
    values:
      layout: "single"
      author_profile: true
      share: true
  - scope:
      path: ""
      type: "teaching"
    values:
      layout: "single"
      author_profile: true
      share: true
